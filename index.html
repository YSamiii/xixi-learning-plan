<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F9D95C">
<title>熹熹启蒙计划</title>
<link rel="manifest" href="manifest.webmanifest">
<style>
:root{--yellow:#f7d65a;--orange:#f1aa2b;--ink:#342b22;--soft:#fffaf0;--line:#eee2c7;--blue:#eaf4ff;}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:#fffdf7;color:var(--ink)}
header{position:sticky;top:0;z-index:5;background:linear-gradient(180deg,#f9df78,#f8d85f);padding:18px 16px 14px;box-shadow:0 2px 12px #0001}
h1{font-size:22px;margin:0 0 4px}
.sub{font-size:13px;opacity:.75}
.wrap{max-width:760px;margin:auto;padding:16px 14px 92px}
.card{background:white;border-radius:22px;padding:16px;margin:0 0 14px;box-shadow:0 8px 24px #a57d1d18;border:1px solid #f3e8c8}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:#fff;border-top:1px solid #eee;display:grid;grid-template-columns:1fr 1fr;padding:8px max(14px,env(safe-area-inset-left)) calc(8px + env(safe-area-inset-bottom));}
.nav button{border:0;background:transparent;padding:8px;font-weight:700;color:#938778;font-size:14px}
.nav button.active{color:#e79d1d}
.view{display:none} .view.active{display:block}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
.tab{border:0;border-radius:14px;padding:12px 6px;background:#f6f1e7;color:#7c6d58;font-weight:700}
.tab.active{background:#ffe57d;color:#5a4218;box-shadow:inset 0 0 0 1px #e7b72f}
.dayrow{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin:10px 0 14px}
.day{border:0;border-radius:12px;padding:10px 2px;background:#f5f3ee;font-size:13px}
.day.active{background:#ffd25b;font-weight:700}
.section-title{font-size:17px;font-weight:800;margin:8px 0 10px}
.item{display:flex;gap:10px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
input[type=checkbox]{width:24px;height:24px;accent-color:#f0aa25;flex:0 0 auto}
.label{line-height:1.45;font-size:15px}
.badge{display:inline-block;font-size:12px;padding:3px 8px;border-radius:999px;background:#fff2b8;margin-left:6px;color:#7c5b08}
.extra{background:#fff8d8;border:1px solid #f1d57a}
.note{font-size:13px;line-height:1.55;color:#766955;background:#f8f5ef;border-radius:14px;padding:12px}
.progress{height:10px;background:#f2ead7;border-radius:99px;overflow:hidden;margin-top:10px}
.bar{height:100%;background:#f0ad2d;width:0%}
.controls{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
button.small{border:0;border-radius:12px;padding:10px 12px;background:#f5eedf;color:#614b26;font-weight:700}
.field{margin:14px 0}
.field label{display:block;font-size:14px;font-weight:700;margin-bottom:7px}
.field input{width:100%;padding:13px 14px;border:1px solid #e7dcc3;border-radius:14px;font-size:16px;background:#fffdf8}
.primary{width:100%;border:0;border-radius:14px;padding:13px 16px;background:#f2b33d;color:#fff;font-size:16px;font-weight:800}
.profile-box{background:linear-gradient(135deg,#fff7c9,#fff);border:1px solid #f1d77d;border-radius:18px;padding:16px;margin-bottom:14px}
.big-age{font-size:30px;font-weight:900;margin:3px 0}
.muted{color:#8b7d68;font-size:13px}
.warning{background:#fff4e5;border:1px solid #f1c98e;color:#7c5320;border-radius:14px;padding:12px;font-size:13px;line-height:1.5;margin-top:12px}
@media (min-width:700px){.wrap{padding-top:24px}}
</style>
</head>
<body>
<header>
  <h1 id="headerTitle">熹熹启蒙计划</h1>
  <div class="sub" id="headerSub">自动计算月龄并匹配启蒙安排</div>
</header>

<div class="wrap">
  <section id="planView" class="view active">
    <div id="profileSummary" class="profile-box"></div>
    <div class="card">
      <div class="tabs" id="weekTabs"></div>
      <div class="dayrow" id="dayTabs"></div>
      <div id="content"></div>
    </div>
    <div class="card">
      <div class="section-title">执行规则</div>
      <div class="note">
        每天完成当日基础启蒙；如该月龄已录入“早教课＋童谣”，则在周一、周三、周五、周六额外安排，确保每周至少4次。当天状态一般时，可以缩短每项时间，但不取消语文、数学或英语中的任何一类。
      </div>
      <div class="progress"><div class="bar" id="bar"></div></div>
      <div id="progressText" class="sub" style="margin-top:6px"></div>
      <div class="controls">
        <button class="small" onclick="resetToday()">重置今天</button>
        <button class="small" onclick="resetAll()">清空全部记录</button>
      </div>
    </div>
  </section>

  <section id="profileView" class="view">
    <div class="card">
      <div class="section-title">宝宝资料</div>
      <div class="field">
        <label for="babyName">宝宝名字</label>
        <input id="babyName" type="text" placeholder="例如：熹熹" maxlength="20">
      </div>
      <div class="field">
        <label for="birthDate">出生日期</label>
        <input id="birthDate" type="date">
      </div>
      <button class="primary" onclick="saveProfile()">保存并匹配计划</button>
      <div id="profileResult"></div>
    </div>
    <div class="card">
      <div class="section-title">月龄计算说明</div>
      <div class="note">
        系统按完整月龄计算。例如，从出生日期到今天满18个月但未满19个月，显示为18月龄。目前已加入18—26月龄计划，系统会根据宝宝完整月龄自动切换到对应计划。
      </div>
    </div>
  </section>
</div>

<nav class="nav">
  <button id="planNav" class="active" onclick="showView('plan')">今日计划</button>
  <button id="profileNav" onclick="showView('profile')">宝宝资料</button>
</nav>

function getProfile(){

function calcMonthAge(dateString){
  if(!dateString) return null;
  const birth = new Date(dateString+"T00:00:00");
  const today = new Date();
  if(isNaN(birth.getTime()) || birth > today) return null;
  let months = (today.getFullYear()-birth.getFullYear())*12 + (today.getMonth()-birth.getMonth());
  if(today.getDate() < birth.getDate()) months--;
  return Math.max(0, months);
}

function availableAges(){
  return [...new Set(plans.map(p=>p.month_age))].sort((a,b)=>a-b);
}

function matchPlanAge(age){
  const ages = availableAges();
  if(age===null) return ages[0];
  if(ages.includes(age)) return age;
  let lower = ages.filter(x=>x<=age);
  return lower.length ? lower[lower.length-1] : ages[0];
}

function ageDetail(dateString){
  const birth = new Date(dateString+"T00:00:00");
  const today = new Date();
  if(isNaN(birth.getTime()) || birth > today) return "";
  let months = calcMonthAge(dateString);
  let anchor = new Date(birth);
  anchor.setMonth(anchor.getMonth()+months);
  let days = Math.floor((today-anchor)/(1000*60*60*24));
  return `${months}个月${days>0?days+"天":""}`;
}

  const birthDate=document.getElementById("birthDate").value;
  if(!name){ alert("请输入宝宝名字"); return; }
  const age=calcMonthAge(birthDate);
  if(age===null){ alert("请选择有效的出生日期"); return; }
  localStorage.setItem("xixi-profile",JSON.stringify({name,birthDate}));
  matchedMonthAge=matchPlanAge(age);
  currentWeek=0;
  renderProfileResult();
  render();
  showView("plan");
}

function renderProfileResult(){
  const p=getProfile();
  const box=document.getElementById("profileResult");
  if(!p.birthDate){box.innerHTML="";return;}
  const age=calcMonthAge(p.birthDate);
  const matched=matchPlanAge(age);
  box.innerHTML=`<div class="profile-box" style="margin-top:14px">
    <div class="muted">${p.name||"宝宝"}当前月龄</div>
    <div class="big-age">${ageDetail(p.birthDate)}</div>
    <div>已匹配：${matched}月龄启蒙计划</div>
    ${age!==matched?`<div class="warning">当前资料库暂未加入${age}月龄计划，因此先显示最近可用的${matched}月龄计划。加入新的月龄内容后会自动切换。</div>`:""}
  </div>`;
}

function renderProfileSummary(){
  const p=getProfile();
  const age=p.birthDate?calcMonthAge(p.birthDate):null;
  matchedMonthAge=matchPlanAge(age);
  const el=document.getElementById("profileSummary");
  if(!p.name || age===null){
    el.innerHTML=`<div class="muted">尚未设置宝宝资料</div><div class="big-age">18月龄计划</div><button class="small" onclick="showView('profile')">设置名字和出生日期</button>`;
  }else{
    el.innerHTML=`<div class="muted">${p.name}当前月龄</div><div class="big-age">${ageDetail(p.birthDate)}</div><div>正在使用：${matchedMonthAge}月龄计划</div>${age!==matchedMonthAge?`<div class="warning">当前仅有${matchedMonthAge}月龄计划，暂按最近可用月龄安排。</div>`:""}`;
    document.getElementById("headerTitle").textContent=`${p.name}启蒙计划`;
  }
}

function currentPlanWeeks(){
  return plans.filter(p=>p.month_age===matchedMonthAge);
}

function key(i){return `xixi-m${matchedMonthAge}-w${currentWeek+1}-d${currentDay+1}-i${i}`;}
function renderTabs(){
  const ws=currentPlanWeeks();
  if(currentWeek>=ws.length) currentWeek=0;
  const wt=document.getElementById("weekTabs");
  wt.innerHTML=ws.map((w,i)=>`<button class="tab ${i===currentWeek?'active':''}" onclick="currentWeek=${i};render()">第${w.week}周</button>`).join("");
  const dt=document.getElementById("dayTabs");
  dt.innerHTML=days.map((d,i)=>`<button class="day ${i===currentDay?'active':''}" onclick="currentDay=${i};render()">${d}</button>`).join("");
}
function render(){
  renderProfileSummary();
  renderTabs();
  const ws=currentPlanWeeks();
  const w=ws[currentWeek];
  const items=[...w.daily];
  if(extraDays.has(currentDay)){
    if(w.extra_course) items.push(w.extra_course);
    if(w.extra_rhyme) items.push(w.extra_rhyme);
    if(w.extra_extension) items.push(w.extra_extension);
    if(w.extra_music) items.push(w.extra_music);
  }
  let html=`<div class="section-title">${matchedMonthAge}月龄 · 第${w.week}周 · ${days[currentDay]}
    ${extraDays.has(currentDay)?'<span class="badge">加强日</span>':''}</div>`;
  html += items.map((x,i)=>`<label class="item ${i>=w.daily.length?'extra':''}">
    <input type="checkbox" ${localStorage.getItem(key(i))==='1'?'checked':''} onchange="localStorage.setItem(key(${i}),this.checked?'1':'0');updateProgress()">
    <div class="label">${x}</div>
  </label>`).join("");
  document.getElementById("content").innerHTML=html;
  updateProgress();
}
function updateProgress(){
  const boxes=[...document.querySelectorAll('#content input[type=checkbox]')];
  const done=boxes.filter(x=>x.checked).length;
  const pct=boxes.length?Math.round(done/boxes.length*100):0;
  document.getElementById("bar").style.width=pct+"%";
  document.getElementById("progressText").textContent=`今日完成 ${done} / ${boxes.length}（${pct}%）`;
}
function resetToday(){
  [...document.querySelectorAll('#content input[type=checkbox]')].forEach((x,i)=>localStorage.removeItem(key(i)));
  render();
}
function resetAll(){
  if(confirm("确定清空全部打卡记录吗？")){
    Object.keys(localStorage).filter(k=>k.startsWith("xixi-m")).forEach(k=>localStorage.removeItem(k));
    render();
  }
}
render();
if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js");
</script>
</body>
